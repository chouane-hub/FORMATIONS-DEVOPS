name: CI
on: [push]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -q "<h1>" index.html
  build:
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t site-devops:${{ github.sha }} .

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: site-devops:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          
      - run: echo "$TOKEN" | docker login -u "$USER" --password-stdin
        env:
         USER: ${{ secrets.DOCKERHUB_USERNAME }}
         TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: |
         IMG=$USER/site-devops:$GITHUB_SHA
         docker tag site-devops:$GITHUB_SHA $IMG
         docker push $IMG
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}