services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: formation
      MYSQL_DATABASE: wordpress
  wordpress:
    image: wordpress
    ports: ["8000:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: formation
    depends_on: [db]